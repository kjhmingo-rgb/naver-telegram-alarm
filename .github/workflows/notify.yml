name: 네이버 캘린더 알림

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정상 몇 분씩 늦게 실행될 수 있음)
  workflow_dispatch:
    inputs:
      test:
        description: "연결 테스트 메시지 보내기"
        type: boolean
        default: true

permissions:
  contents: write   # 알림 보낸 기록(state/sent.json)을 저장하기 위해 필요

concurrency:
  group: naver-telegram-alarm
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 일정 확인 및 알림
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REMIND_MINUTES_BEFORE: ${{ vars.REMIND_MINUTES_BEFORE }}
          DAILY_SUMMARY_HOUR: ${{ vars.DAILY_SUMMARY_HOUR }}
          CALENDAR_NAMES: ${{ vars.CALENDAR_NAMES }}
        run: python notify.py ${{ inputs.test && '--test' || '' }}

      - name: 알림 기록 저장
        run: |
          if [ ! -f state/sent.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/sent.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "알림 기록 업데이트"
          git pull --rebase --quiet || true
          git push
