name: 텔레그램 일정 등록

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 텔레그램 새 메시지 확인
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-inbox
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 새 메시지를 캘린더에 등록
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_CALENDAR: ${{ vars.TARGET_CALENDAR }}
        run: python inbox.py

      - name: 처리 위치 저장
        run: |
          if [ ! -f state/telegram_offset.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/telegram_offset.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "텔레그램 처리 위치"
          git pull --rebase --quiet || true
          git push
